name: Build Android APK

on:
  push:
    branches:
      - fix/android-v2-and-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Check for removed Android v1 embedding
        run: |
          if grep -RInE 'io\.flutter\.(app|view|facade)\.|PluginRegistry\.Registrar|registrarFor\(|getFlutterView\(' android lib; then
            echo "Android v1 embedding reference found."
            exit 1
          fi
          echo "Android v2 embedding check passed."

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: imdad-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
